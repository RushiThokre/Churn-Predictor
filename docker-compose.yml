services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: churnshield
      POSTGRES_USER: churnshield
      POSTGRES_PASSWORD: churnshield-dev
    volumes:
      - churnshield-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnshield -d churnshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      API_KEY: change-me
      DATABASE_URL: postgresql+psycopg2://churnshield:churnshield-dev@postgres:5432/churnshield
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8501:8501"

volumes:
  churnshield-postgres:
